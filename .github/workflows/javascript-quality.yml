name: JavaScript Quality

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build core and vanilla for demo source regressions
        run: |
          test -f ./tools/build-packages.mjs || exit 1
          test -f ./apps/docs/docs/public/editor/hwpjs/hwpjs.wasm || exit 1
          bun ./tools/build-packages.mjs --package=core --web --wasm="$PWD/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm"
          bun ./tools/build-packages.mjs --package=vanilla --web --wasm="$PWD/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm"
      - name: Test caret formatting and terminal focus source regressions
        timeout-minutes: 2
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          export HWPJS_TEST_CORE_DIST=packages/core/dist
          set -- \
            ./packages/core/tests/caret-formatting.test.mjs \
            ./packages/core/tests/state/formatting-readonly-source.test.mjs \
            ./packages/core/tests/state/formatting-state.test.ts \
            ./packages/core/tests/commands/formatting.test.ts \
            ./apps/demo/tests/caret-core-readonly-integration.test.mjs \
            ./apps/demo/tests/caret-formatting-app.test.mjs \
            ./apps/demo/tests/caret-formatting-typing.test.mjs \
            ./apps/demo/tests/caret-font-name-tool.test.mjs \
            ./apps/demo/tests/caret-noop-focus.test.mjs \
            ./apps/demo/tests/core-single-terminal-focus.test.mjs \
            ./packages/vanilla/tests/caret-formatting.test.mjs \
            ./packages/vanilla/tests/caret-pointer-presentation.test.mjs \
            ./packages/vanilla/tests/new-document-initial-selection.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --experimental-transform-types --max-old-space-size=512 \
            --import ./tools/renderer-test-core-provider.mjs \
            --import ./packages/vanilla/tests/non-text-history-renderer-hook.mjs \
            --test --test-concurrency=1 --test-timeout=50000 "$@"
      - name: Test new document and table appearance contracts
        timeout-minutes: 2
        run: |
          bun test --no-install \
            ./packages/core/tests/editor/new-document.test.ts \
            ./packages/core/tests/editor/new-document-selection.test.ts \
            ./apps/demo/tests/new-document.test.ts \
            ./apps/demo/tests/new-document-shortcut.test.ts
          node --max-old-space-size=256 --test --test-concurrency=1 \
            ./tests/cell-border-batch.test.mjs \
            ./tests/cell-appearance-command.test.mjs \
            ./tests/cell-fill-command.test.mjs \
            ./tests/cell-diagonal-command.test.mjs \
            ./tests/hwp5/table-diagonal-paint-plan.test.mjs \
            ./tests/hwpx/table-diagonal-paint.test.mjs \
            ./tests/hwpx/table-border-paint.test.mjs \
            ./tests/hwpx/table-semantic-face-fill.test.mjs \
            ./tests/hwpx/table-semantic-fill-source.test.mjs \
            ./tools/tests/hwpx-table-border-raw-fields.test.mjs \
            ./tests/hwp5/table-border-fill-plan.test.mjs \
            ./tests/hwp5/table-variant-fill-plan.test.mjs \
            ./tools/tests/table-cell-appearance-observation.test.mjs \
            ./tools/tests/table-cell-appearance-official-hatch.test.mjs \
            ./tests/table-border-plan.test.mjs
      - name: Test integrated table appearance dialog
        timeout-minutes: 2
        run: |
          node --experimental-transform-types --max-old-space-size=256 \
            --import ./tools/object-properties-test-css.mjs \
            --import ./apps/demo/tests/table-cell-appearance-style-preload.mjs \
            --test --test-isolation=none --test-concurrency=1 \
            ./apps/demo/tests/table-cell-appearance-port.test.mjs \
            ./apps/demo/tests/table-cell-appearance-view.test.mjs \
            ./apps/demo/tests/table-cell-appearance-tool.test.mjs
      - name: Test symbol catalog and six-alignment quick actions
        timeout-minutes: 2
        run: |
          set -- \
            ./apps/demo/tests/symbol-buffer.test.ts \
            ./apps/demo/tests/symbol-category-data.test.ts \
            ./apps/demo/tests/symbol-dialog.test.ts \
            ./apps/demo/tests/symbol-insertion-boundary.test.ts \
            ./apps/demo/tests/quick-alignment-six.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          bun test --no-install "$@"
      - name: Share official Native WASM input pin
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          HWPJS_TEST_WASM_EXPECTED_SHA256="$(node ./tools/tests/helpers/native-wasm-pin.mjs --manifest ./packages/core/dist/build-manifest.json)" || exit 1
          printf 'HWPJS_TEST_WASM_EXPECTED_SHA256=%s\n' "$HWPJS_TEST_WASM_EXPECTED_SHA256" >> "$GITHUB_ENV"
      - name: Test original table style and fill Native transactions
        timeout-minutes: 2
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_NOORI: ${{ github.workspace }}/apps/docs/docs/public/editor/fixtures/noori.hwp
          HWPJS_TEST_NOORI_HWPX: ${{ github.workspace }}/apps/docs/docs/public/editor/fixtures/noori.hwpx
        run: |
          export HWPJS_TEST_WASM_SHA256="$HWPJS_TEST_WASM_EXPECTED_SHA256"
          node --max-old-space-size=512 --test --test-concurrency=1 \
            --test-timeout=45000 ./tests/cell-style-fill-native.test.mjs \
            ./tests/cell-diagonal-native.test.mjs \
            ./tools/tests/cell-diagonal-runtime.test.mjs \
            ./tools/tests/hwpx-border-source-raw-native.test.mjs
      - name: Test public package JSX runtime compatibility
        run: bun test ./tests/public-package-jsx-runtime.test.mjs
      - name: Test owned observation freeze boundaries
        run: |
          test -f ./packages/core/tests/state/owned.test.ts || exit 1
          test -f ./packages/core/tests/state/owned-freeze-observation.test.ts || exit 1
          bun test --no-install ./packages/core/tests/state/owned.test.ts ./packages/core/tests/state/owned-freeze-observation.test.ts
      - name: Check demo shell icon and command types
        run: |
          test -f ./tools/tsconfig.demo-shell.json || exit 1
          bunx --no-install tsc --noEmit -p ./tools/tsconfig.demo-shell.json
      - name: Test demo toolbar and find dialog
        run: |
          bun test --no-install ./apps/demo/tests/shell.test.mjs ./apps/demo/tests/shell-fixture-availability.test.mjs ./apps/demo/tests/toolbox.test.mjs ./apps/demo/tests/text-tools-dialog-density.test.ts ./apps/demo/tests/file-open-direct.test.mjs
      - name: Test exclusive text snapshot reuse boundaries
        run: |
          node --test --test-concurrency=1 \
            ./packages/core/tests/runtime/full-snapshot-text-delta.test.mjs \
            ./packages/core/tests/internal/private-history-edges.test.ts \
            ./packages/core/tests/internal/private-history-edges-reentrancy.test.ts \
            ./packages/core/tests/internal/private-history-owner-hints.test.ts \
            ./packages/core/tests/internal/history-owner-window-controller.test.mjs \
            ./packages/core/tests/editor/capabilities-observation.test.mjs \
            ./tests/hwpx/host-epoch-readers.test.mjs \
            ./tests/hwpx/native-picture-refresh-gate.test.mjs \
            ./tests/hwpx/picture-resources-settled.test.mjs \
            ./apps/demo/tests/surface-environment.test.ts
      - name: Test real HWP5 text reuse and history
        timeout-minutes: 2
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_NOORI: ${{ github.workspace }}/apps/docs/docs/public/editor/fixtures/noori.hwp
        run: |
          node --max-old-space-size=512 --test --test-concurrency=1 --test-timeout=50000 \
            ./tools/tests/native-wasm-pin.test.mjs \
            ./tools/tests/hwp5-native-text-reuse.test.mjs \
            ./tools/tests/hwp5-worker-cow-regression.test.mjs \
            ./tools/tests/hwp5-worker-public-full.test.mjs \
            ./tools/tests/hwp5-worker-history-window.test.mjs \
            ./tools/tests/hwp5-runtime-reply-shape.test.mjs \
            ./tools/tests/worker-cow-source-contract.test.mjs
      - name: Check private projection companion types
        run: bunx --no-install tsc --noEmit -p ./tools/tests/tsconfig.history-owner-window.json
      - name: Test WASM loader buffer ownership
        run: node --test ./packages/core/tests/runtime/wasm-module-loader-owned-input.test.ts
      - name: Test versioned demo Worker assets
        run: |
          test -f ./tools/tests/worker-assets.test.mjs || exit 1
          node --test ./tools/tests/worker-assets.test.mjs
      - name: Test published demo runtime asset paths
        run: |
          test -f ./apps/demo/tests/runtime-assets.test.ts || exit 1
          test -f ./tests/hwpx/pages-runtime-asset-paths.test.mjs || exit 1
          bun test ./apps/demo/tests/runtime-assets.test.ts ./tests/hwpx/pages-runtime-asset-paths.test.mjs
      - name: Test explicit demo bundle policies and routes
        env:
          HWPJS_TEST_PUBLIC_FIXTURE_POLICY: tools/pages-demo/public-gallery-fixtures.json
        run: |
          test -f ./tests/hwpx/demo-server-fixture-policy.test.mjs || exit 1
          test -f ./tests/hwpx/demo-server-bundle.test.mjs || exit 1
          test -f ./tests/hwpx/demo-fixture-provider-root.test.mjs || exit 1
          test -f ./tools/pages-demo/public-gallery-fixtures.json || exit 1
          node --test --test-concurrency=1 ./tests/hwpx/demo-fixture-provider-root.test.mjs ./tests/hwpx/demo-server-fixture-policy.test.mjs ./tests/hwpx/demo-server-bundle.test.mjs
      - name: Test selected table object and formatting command regressions
        timeout-minutes: 2
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          test -f ./tools/object-properties-test-css.mjs || exit 1
          test -f ./apps/demo/tests/table-cell-properties-style-preload.mjs || exit 1
          set -- \
            ./apps/demo/tests/table-cell-size-units.test.mjs \
            ./apps/demo/tests/table-cell-properties-port.test.mjs \
            ./apps/demo/tests/table-cell-properties-view.test.mjs \
            ./apps/demo/tests/table-cell-properties-tool.test.mjs \
            ./apps/demo/tests/object-properties-port.test.mjs \
            ./apps/demo/tests/object-properties-controller.test.mjs \
            ./apps/demo/tests/object-properties-view.test.mjs \
            ./apps/demo/tests/object-properties-reentry.test.mjs \
            ./apps/demo/tests/object-properties-size-integration.test.mjs \
            ./apps/demo/tests/context-menu-target.test.ts \
            ./apps/demo/tests/command-support.test.ts \
            ./tests/hwpx/canvas-display-options.test.mjs \
            ./tests/hwpx/formatting-marks.test.mjs \
            ./tests/hwpx/formatting-marks-original-cells.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --experimental-transform-types --max-old-space-size=256 \
            --import ./tools/object-properties-test-css.mjs \
            --import ./apps/demo/tests/table-cell-properties-style-preload.mjs \
            --test --test-isolation=none --test-concurrency=1 "$@"
      - name: Test original font and size observation display
        timeout-minutes: 2
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          set -- \
            ./apps/demo/tests/formatting-observation-display.test.mjs \
            ./apps/demo/tests/formatting-observation-shell.test.mjs \
            ./apps/demo/tests/formatting-observation-bridge.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --experimental-transform-types --max-old-space-size=256 \
            --test --test-concurrency=1 "$@"
      - name: Test multi-paragraph formatting app port regressions
        timeout-minutes: 2
        env:
          HWPJS_TEST_CORE_DIST: packages/core/dist
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          test -f ./tools/renderer-test-core-provider.mjs || exit 1
          test -f ./apps/demo/tests/formatting-style-preload.mjs || exit 1
          set -- \
            ./apps/demo/tests/selection-decoration-bridge.test.mjs \
            ./apps/demo/tests/surface-selection-command-support.test.mjs \
            ./apps/demo/tests/mac-surface-selection-shortcuts.test.mjs \
            ./apps/demo/tests/multiblock-formatting-app.test.mjs \
            ./apps/demo/tests/formatting-language-controls.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --experimental-transform-types --max-old-space-size=512 \
            --import ./tools/renderer-test-core-provider.mjs \
            --test --test-concurrency=1 --test-timeout=50000 "$@"
      - name: Test multi-paragraph clipboard capture surface regressions
        timeout-minutes: 2
        env:
          HWPJS_TEST_CORE_DIST: packages/core/dist
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          test -f ./tools/renderer-test-core-provider.mjs || exit 1
          test -f ./packages/vanilla/tests/non-text-history-renderer-hook.mjs || exit 1
          test -f ./packages/vanilla/tests/non-text-history-fixture.mjs || exit 1
          test -f ./packages/vanilla/tests/multiblock-clipboard-fixture.mjs || exit 1
          set -- \
            ./packages/vanilla/tests/multiblock-clipboard-capture.test.mjs \
            ./packages/vanilla/tests/multiblock-clipboard-safety.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --experimental-transform-types --max-old-space-size=256 \
            --import ./tools/renderer-test-core-provider.mjs \
            --import ./packages/vanilla/tests/non-text-history-renderer-hook.mjs \
            --test --test-concurrency=1 "$@"
      - name: Test multi-paragraph formatting history selection lifecycle
        timeout-minutes: 2
        env:
          HWPJS_TEST_CORE_DIST: packages/core/dist
        run: |
          test -f ./tools/renderer-test-core-provider.mjs || exit 1
          test -f ./packages/core/dist/build-manifest.json || exit 1
          test -f ./packages/vanilla/tests/non-text-history-renderer-hook.mjs || exit 1
          test -f ./packages/vanilla/tests/non-text-history-fixture.mjs || exit 1
          test -f ./packages/vanilla/tests/multiblock-clipboard-fixture.mjs || exit 1
          test -f ./packages/vanilla/tests/multiblock-format-history-selection.test.mjs || exit 1
          node --experimental-transform-types --max-old-space-size=256 \
            --import ./tools/renderer-test-core-provider.mjs \
            --import ./packages/vanilla/tests/non-text-history-renderer-hook.mjs \
            --test --test-concurrency=1 \
            ./packages/vanilla/tests/multiblock-format-history-selection.test.mjs
      - name: Test multi-paragraph formatting surface regressions
        timeout-minutes: 2
        env:
          HWPJS_TEST_CORE_DIST: packages/core/dist
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          test -f ./tools/renderer-test-core-provider.mjs || exit 1
          test -f ./packages/vanilla/tests/non-text-history-renderer-hook.mjs || exit 1
          test -f ./packages/vanilla/tests/multirange-formatting-fixture.mjs || exit 1
          set -- \
            ./packages/vanilla/tests/multirange-formatting-surface.test.mjs \
            ./packages/vanilla/tests/multirange-formatting-observation.test.mjs \
            ./packages/vanilla/tests/formatting-patch-lease.test.mjs \
            ./packages/vanilla/tests/formatting-patch-batch.test.mjs \
            ./packages/vanilla/tests/formatting-patch-surface.test.mjs \
            ./packages/vanilla/tests/formatting-patch-core.test.mjs \
            ./packages/vanilla/tests/formatting-capability-reason.test.mjs \
            ./packages/vanilla/tests/formatting-settled-current.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --experimental-transform-types --max-old-space-size=512 \
            --import ./tools/renderer-test-core-provider.mjs \
            --import ./packages/vanilla/tests/non-text-history-renderer-hook.mjs \
            --test --test-concurrency=1 --test-timeout=50000 "$@"
      - name: Test non-text selection history surface lifecycle
        timeout-minutes: 2
        env:
          HWPJS_TEST_CORE_DIST: packages/core/dist
        run: |
          test -f ./tools/renderer-test-core-provider.mjs || exit 1
          test -f ./packages/core/dist/build-manifest.json || exit 1
          test -f ./packages/vanilla/tests/non-text-history-surface.test.mjs || exit 1
          test -f ./packages/vanilla/tests/non-text-history-rejected-picture.test.mjs || exit 1
          test -f ./packages/vanilla/tests/non-text-history-rejected-picture-negative.test.mjs || exit 1
          test -f ./packages/vanilla/tests/non-text-history-fixture.mjs || exit 1
          test -f ./packages/vanilla/tests/non-text-history-renderer-hook.mjs || exit 1
          node --max-old-space-size=256 --experimental-transform-types \
            --import ./tools/renderer-test-core-provider.mjs \
            --import ./packages/vanilla/tests/non-text-history-renderer-hook.mjs \
            --test --test-concurrency=1 \
            ./packages/vanilla/tests/non-text-history-surface.test.mjs \
            ./packages/vanilla/tests/non-text-history-rejected-picture.test.mjs \
            ./packages/vanilla/tests/non-text-history-rejected-picture-negative.test.mjs
      - name: Test renderer measurements and queued input frames
        env:
          HWPJS_TEST_CORE_DIST: packages/core/dist
        run: |
          set -- \
            ./tests/hwpx/renderer-glyph-metrics.test.mjs \
            ./tests/hwpx/renderer-projection-measure.test.mjs \
            ./packages/vanilla/tests/native-geometry-renderer.test.mjs \
            ./packages/vanilla/tests/native-geometry-deps.test.mjs \
            ./tests/hwpx/undo-onset-candidate.test.mjs \
            ./packages/vanilla/tests/undo-onset-surface-integration.test.mjs \
            ./packages/vanilla/tests/undo-onset-held-renderer.test.mjs \
            ./packages/vanilla/tests/renderer-ack-projection.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --import ./tools/renderer-test-core-provider.mjs --test "$@"
      - name: 데모 표 만들기 공개 API 모델 검사
        run: |
          set -- \
            ./apps/demo/tests/table-insert.test.ts \
            ./apps/demo/tests/table-insert-uncertain.test.ts
          for path in "$@"; do test -f "$path" || exit 1; done
          bun test --no-install "$@"
      - name: 표 삽입 공개 명령 모델 검사
        run: |
          test -f ./packages/core/tests/commands/table-insert.test.ts || exit 1
          test -f ./packages/core/tests/state/paragraph-selection-facade.test.ts || exit 1
          bun test --no-install ./packages/core/tests/commands/table-insert.test.ts ./packages/core/tests/state/paragraph-selection-facade.test.ts
      - name: 표 삽입 명시 Native 통합 검사
        run: |
          test -f ./packages/core/integration/commands/table-insert.test.ts || exit 1
          test -f ./packages/core/dist/build-manifest.json || exit 1
          export HWPJS_TEST_WASM="$PWD/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm"
          test -f "$HWPJS_TEST_WASM" || exit 1
          export TABLE_FIXTURE_ROOT="$PWD/legacy/rust/crates/hwp-core/tests/fixtures"
          export TABLE_INSERT_OUTPUT="$RUNNER_TEMP/table-insert-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$TABLE_INSERT_OUTPUT" || exit 1
          mkdir "$TABLE_INSERT_OUTPUT"
          bun test --no-install ./packages/core/integration/commands/table-insert.test.ts
      - name: Test paragraph formatting dialogs
        run: |
          set -- \
            ./apps/demo/tests/paragraph-resource-input.test.ts \
            ./apps/demo/tests/paragraph-resource-view.test.ts \
            ./apps/demo/tests/paragraph-background-replacement.test.ts \
            ./apps/demo/tests/paragraph-shape-fallback.test.ts \
            ./apps/demo/tests/paragraph-shape-number.test.ts \
            ./apps/demo/tests/paragraph-shape-tool.test.ts \
            ./apps/demo/tests/paragraph-shape-ui.test.ts \
            ./apps/demo/tests/paragraph-spacing-kind.test.ts
          for path in "$@"; do test -f "$path" || exit 1; done
          bun test --no-install "$@"
      - name: Test existing note paragraph selection from source
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
        run: |
          test -f "$HWPJS_TEST_WASM" || exit 1
          test -f ./legacy/rust/crates/hwp-core/tests/fixtures/footnote-endnote.hwp || exit 1
          set -- \
            ./tools/tests/existing-note-selection.test.ts \
            ./tests/hwp5/note-selection-owner.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          bun test --no-install "$@"
      - name: Test delegated context menu composition lifetime
        run: |
          test -f ./tests/hwpx/document-context-menu-composition.test.mjs || exit 1
          node --test ./tests/hwpx/document-context-menu-composition.test.mjs
      - name: Test footnote continuation and ordering
        run: |
          set -- \
            ./tests/hwp5/plain-footnote-continuation.test.mjs \
            ./tests/hwp5/plain-footnote-stable-order.test.mjs \
            ./tests/hwp5/plain-footnote-lock-audit.test.mjs \
            ./tests/hwp5/footnote-allocation-index.test.mjs \
            ./tests/hwp5/mixed-note-table-continuation.test.mjs \
            ./tests/hwp5/recorded-mixed-note-continuation.test.mjs \
            ./tests/hwp5/source-note-projection-optin.test.mjs \
            ./tests/hwp5/footnote-trial-projection.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          bun test --no-install "$@"
      - name: 이력 모델과 paint 준비 검사
        run: |
          set -- \
            ./tests/hwpx/history-model-presentation.test.mjs \
            ./tests/hwpx/history-paint-authority.test.mjs \
            ./tests/hwp5/history-selection-canvas.test.mjs \
            ./tests/hwp5/history-input-intent-queue.test.mjs \
            ./tests/hwp5/history-input-intent-readiness.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          bun test --no-install "$@"
      - name: 공개 예제 정책 정규 회귀
        run: |
          test -f ./tests/tools/pages-demo-fixture-policy.test.mjs || exit 1
          node --test --test-concurrency=1 ./tests/tools/pages-demo-fixture-policy.test.mjs
      - name: 문단 측정과 배치 분리 source 회귀
        run: |
          node --test --test-concurrency=1 \
            ./tests/hwp5/measurement-placement.test.mjs \
            ./tests/hwpx/renderer-projection-measure.test.mjs \
            ./tests/hwp5/line-spacing-compat.test.mjs
      - name: Test AI document CLI and independent save oracles
        timeout-minutes: 3
        run: |
          export HWPJS_CLI_NATIVE=1
          export HWPJS_TEST_WASM="$PWD/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm"
          export HWPJS_TEST_WASM_SHA256=82031994b4b7f066c28c725495954eebc67bb25570869c06528ea328e0155ccc
          export HWPJS_TEST_NOORI="$PWD/apps/docs/docs/public/editor/fixtures/noori.hwp"
          export HWPJS_TEST_NOORI_HWPX="$PWD/apps/docs/docs/public/editor/fixtures/noori.hwpx"
          export HWPJS_TEST_HEADERFOOTER="$PWD/apps/docs/docs/public/editor/fixtures/headerfooter.hwp"
