name: JavaScript Quality

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test public package JSX runtime compatibility
        run: bun test ./tests/public-package-jsx-runtime.test.mjs
      - name: Test published demo runtime asset paths
        run: bun test ./apps/demo/tests/runtime-assets.test.ts ./tests/hwpx/pages-runtime-asset-paths.test.mjs
      - name: Check derived quality configuration
        run: bun run quality:config
      - name: Test quality scope and safety contracts
        run: bun test ./tools/quality.test.mjs
      - name: Lint tracked JavaScript and TypeScript
        run: bun run lint
      - name: Check tracked source formatting
        run: bun run format:check
