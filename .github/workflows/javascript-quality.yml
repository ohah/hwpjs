name: JavaScript Quality

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test current public demo dependency notices
        run: node --test tools/tests/ui-license-inputs.test.mjs
      - name: Test bounded Native fixture preflight
        run: |
          test -f ./tools/tests/native-fixture-preflight.test.mjs || exit 1
          node --test ./tools/tests/native-fixture-preflight.test.mjs
      - name: Build core and vanilla for demo source regressions
        run: |
          test -f ./tools/build-packages.mjs || exit 1
          test -f ./apps/docs/docs/public/editor/hwpjs/hwpjs.wasm || exit 1
          bun ./tools/build-packages.mjs --package=core --web --wasm="$PWD/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm"
          bun ./tools/build-packages.mjs --package=vanilla --web --wasm="$PWD/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm"
      - name: Test caret formatting and terminal focus source regressions
        timeout-minutes: 2
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          export HWPJS_TEST_CORE_DIST=packages/core/dist
          set -- \
            ./packages/core/tests/caret-formatting.test.mjs \
            ./packages/core/tests/state/formatting-readonly-source.test.mjs \
            ./packages/core/tests/state/formatting-state.test.ts \
            ./packages/core/tests/commands/formatting.test.ts \
            ./apps/demo/tests/caret-core-readonly-integration.test.mjs \
            ./apps/demo/tests/caret-formatting-app.test.mjs \
            ./apps/demo/tests/caret-formatting-typing.test.mjs \
            ./apps/demo/tests/caret-font-name-tool.test.mjs \
            ./apps/demo/tests/caret-noop-focus.test.mjs \
            ./apps/demo/tests/core-single-terminal-focus.test.mjs \
            ./packages/vanilla/tests/caret-formatting.test.mjs \
            ./packages/vanilla/tests/caret-pointer-presentation.test.mjs \
            ./packages/vanilla/tests/new-document-initial-selection.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --experimental-transform-types --max-old-space-size=512 \
            --import ./tools/renderer-test-core-provider.mjs \
            --import ./packages/vanilla/tests/non-text-history-renderer-hook.mjs \
            --test --test-concurrency=1 --test-timeout=50000 "$@"
      - name: Test generated table grid commands and actual surface selection
        timeout-minutes: 2
        run: |
          bun test --no-install ./packages/core/tests/commands/created-table-grid.test.ts
          HWPJS_TEST_CORE_DIST=packages/core/dist node --max-old-space-size=512 \
            --import ./tools/renderer-test-core-provider.mjs \
            --import ./packages/vanilla/tests/non-text-history-renderer-hook.mjs \
            --test --test-concurrency=1 \
            ./packages/vanilla/tests/generated-table-grid-selection.test.mjs \
            ./apps/demo/tests/generated-table-grid-port.test.mjs \
            ./apps/demo/tests/generated-table-grid-ui.test.mjs \
            ./tools/tests/created-table-grid-sdk.test.mjs \
            ./tools/tests/public-demo-fixtures.test.mjs
      - name: Test source table live grid SDK, Core, selection and UI
        timeout-minutes: 2
        run: |
          bun test --no-install ./packages/core/tests/commands/source-table-grid.test.ts
          test -f ./tests/hwpx/inline-table-paper-preview.test.mjs || exit 1
          test -f ./packages/vanilla/tests/preview-edit-policy.test.mjs || exit 1
          test -f ./tests/hwpx/visible-overflow-cell-edit.test.mjs || exit 1
          test -f ./tests/hwpx/overflow-preview-barrier.test.mjs || exit 1
          test -f ./packages/vanilla/tests/preview-visible-cell-policy.test.mjs || exit 1
          test -f ./packages/vanilla/tests/preview-visible-cell-pointer.test.mjs || exit 1
          HWPJS_TEST_CORE_DIST=packages/core/dist node --experimental-transform-types --max-old-space-size=512 \
            --import ./tools/renderer-test-core-provider.mjs \
            --test ./packages/vanilla/tests/table-grid-view-surface.test.ts
          HWPJS_TEST_CORE_DIST=packages/core/dist node --experimental-transform-types --max-old-space-size=512 \
            --import ./tools/renderer-test-core-provider.mjs \
            --import ./packages/vanilla/tests/non-text-history-renderer-hook.mjs \
            --test --test-concurrency=1 \
            ./tools/tests/source-table-grid-sdk.test.mjs \
            ./packages/vanilla/tests/source-table-grid-selection.test.mjs \
            ./packages/vanilla/tests/source-table-grid-history.test.mjs \
            ./packages/vanilla/tests/source-table-grid-multipara-history.test.mjs \
            ./tests/hwpx/inline-table-fit-rejection.test.mjs \
            ./tests/hwpx/inline-table-paper-preview.test.mjs \
            ./tests/hwpx/visible-overflow-cell-edit.test.mjs \
            ./tests/hwpx/overflow-preview-barrier.test.mjs \
            ./packages/vanilla/tests/preview-visible-cell-policy.test.mjs \
            ./packages/vanilla/tests/preview-visible-cell-pointer.test.mjs \
            ./packages/vanilla/tests/preview-edit-policy.test.mjs \
            ./apps/demo/tests/source-table-grid-port.test.mjs \
            ./apps/demo/tests/source-table-grid-ui.test.mjs \
            ./apps/demo/tests/table-grid-port.test.mjs \
            ./tests/hwpx/table-grid-view.test.mjs \
            ./packages/core/tests/internal/owner-window-source-grid-capability.test.mjs
      - name: Test expanded source grids and plain captions with independent file oracles
        timeout-minutes: 3
        run: |
          bun tools/run-source-grid-regressions.mjs --wasm "$PWD/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm" --out "$RUNNER_TEMP/hwpjs-source-grid-current"

      - name: Test immutable source table file facade and shared reference resolution
        timeout-minutes: 2
        run: |
          set -- \
            ./tools/tests/table-file-grid-sdk.test.mjs \
            ./packages/cli/tests/edit-table-grid-service.test.mjs \
            ./packages/cli/tests/table-reference-resolution.test.mjs \
            ./packages/cli/tests/delete-table-service.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          node --max-old-space-size=512 --test --test-concurrency=1 "$@"
      - name: Test paragraph marker layout and caret geometry
        timeout-minutes: 2
        run: |
          node --test tests/wasm/paragraph-marker-paint.test.mjs tests/wasm/paragraph-numbering.test.mjs tests/wasm/caret-paragraph-heading.test.mjs tests/hwpx/number-prefix-paint.test.mjs tests/hwp5/table-cell-block.test.mjs

      - name: Test source table cell splitting and dimension equalization
        timeout-minutes: 2
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
        run: |
          bun test --no-install ./tests/hwpx/source-table-cell-split.test.mjs ./tests/hwpx/source-table-cell-width.test.mjs ./tests/hwpx/source-table-cell-height.test.mjs ./tests/hwpx/source-table-rectangular-grid.test.mjs ./tests/hwp5/source-table-cell-width.test.mjs ./tests/hwp5/source-table-cell-height.test.mjs
          node --test tests/hwpx/source-table-row-horizontals.test.mjs apps/demo/tests/table-cell-height-menu-label.test.mjs

      - name: Test paragraph bullet editing with a pinned previous engine
        timeout-minutes: 3
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_OLD_WASM: ${{ runner.temp }}/hwpjs-before-bullet.wasm
          HWPJS_BULLET_EVIDENCE_DIR: ${{ runner.temp }}/hwpjs-bullet-evidence
        run: |
          previous_engine=f2c3075a972d353c1a51661153e9e9a1d5ee767e
          if ! git cat-file -e "$previous_engine^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$previous_engine"
          fi
          git show "$previous_engine:apps/docs/docs/public/editor/hwpjs/hwpjs.wasm" > "$HWPJS_TEST_OLD_WASM"
          printf '%s  %s\n' '585c80637a1cad6edecb503fe4b3fa1694d2d2ef4610ee6cbcb3b21728d0c5c6' "$HWPJS_TEST_OLD_WASM" | sha256sum --check
          bun test --no-install ./tests/hwpx/paragraph-bullet-write.test.ts

      - name: Test complete paragraph bullet inventory and UI admission
        timeout-minutes: 3
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_OLD_WASM: ${{ runner.temp }}/hwpjs-before-bullet.wasm
          HWPJS_TEST_UNUSED_BULLETS: ${{ runner.temp }}/hwpjs-unused-bullets.hwpx
        run: |
          python3 tests/helpers/unused-bullet-definitions-fixture.py --input apps/docs/docs/public/editor/fixtures/lists-bullet.hwpx --output "$HWPJS_TEST_UNUSED_BULLETS"
          bun test --no-install tests/wasm/paragraph-bullet-definitions.test.mjs packages/core/tests/editor/paragraph-bullet-definitions.test.ts apps/demo/tests/paragraph-bullet-inventory.test.ts

      - name: Test paragraph bullet definition writes and independent XML preservation
        timeout-minutes: 3
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_OLD_WASM: ${{ runner.temp }}/hwpjs-before-bullet-definition.wasm
          HWPJS_TEST_EVIDENCE: ${{ runner.temp }}/hwpjs-bullet-definition-evidence
        run: |
          inventory_engine=77eae1cb82e05c980071910228e1189ac5c2222d
          if ! git cat-file -e "$inventory_engine^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$inventory_engine"
          fi
          git show "$inventory_engine:apps/docs/docs/public/editor/hwpjs/hwpjs.wasm" > "$HWPJS_TEST_OLD_WASM"
          printf '%s  %s\n' 'a3be6777229dbe1ec895f4850168809f70d9cf52b14b85996a670a5577e865f1' "$HWPJS_TEST_OLD_WASM" | sha256sum --check
          bun test --no-install tests/wasm/paragraph-bullet-definition-write.test.mjs packages/core/tests/editor/paragraph-bullet-definition-write.test.ts

      - name: Test HWP5 original cell split with independent CFB preservation
        timeout-minutes: 3
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_OLD_WASM: ${{ runner.temp }}/hwpjs-before-h5-cell-split.wasm
          HWPJS_TEST_EVIDENCE: ${{ runner.temp }}/hwpjs-h5-cell-split-evidence
        run: |
          previous_engine=687255a5fefac1cac249c1afb59459389f35889f
          if ! git cat-file -e "$previous_engine^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$previous_engine"
          fi
          git show "$previous_engine:apps/docs/docs/public/editor/hwpjs/hwpjs.wasm" > "$HWPJS_TEST_OLD_WASM"
          printf '%s  %s\n' '5ece4c0a551716239c37af0e1ff40db7b2a642e1baf75bb27782bcf237bd1621' "$HWPJS_TEST_OLD_WASM" | sha256sum --check
          bun test --timeout=30000 --no-install tests/hwp5/source-table-cell-split.test.mjs

      - name: Test merged HWP5 cells and empty caret source formatting
        timeout-minutes: 3
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_NARROW_SPLIT_WASM: ${{ runner.temp }}/hwpjs-before-merged-cell-split.wasm
          HWPJS_TEST_EVIDENCE: ${{ runner.temp }}/hwpjs-merged-empty-caret
        run: |
          previous_engine=9dc8b89433da1926b1db72fc7be45081b063f45e
          if ! git cat-file -e "$previous_engine^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$previous_engine"
          fi
          git show "$previous_engine:apps/docs/docs/public/editor/hwpjs/hwpjs.wasm" > "$HWPJS_TEST_NARROW_SPLIT_WASM"
          printf '%s  %s\n' '8ab4d335f7fba4aa764ed3e1191c390f17ee80f053b9ada89748a490547d1980' "$HWPJS_TEST_NARROW_SPLIT_WASM" | sha256sum --check
          bun test --timeout=30000 --no-install tests/hwp5/source-table-merged-cell-split.test.mjs tests/hwp5/empty-caret-formatting.test.mjs tests/empty-insertion-wire.test.mjs packages/core/tests/state/empty-caret-formatting.test.ts

      - name: Test bullet definition API, CLI and MCP against Native
        timeout-minutes: 3
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_OLD_WASM: ${{ runner.temp }}/hwpjs-before-bullet-definition.wasm
          HWPJS_TEST_EVIDENCE: ${{ runner.temp }}/hwpjs-bullet-bridge-evidence
          HWPJS_TEST_HWPX: ${{ github.workspace }}/apps/docs/docs/public/editor/fixtures/page.hwpx
          HWPJS_TEST_HWP5: ${{ github.workspace }}/apps/docs/docs/public/editor/fixtures/lists.hwp
        run: |
          test -f "$HWPJS_TEST_OLD_WASM" || exit 1
          export HWPJS_TEST_WASM_EXPECTED_SHA256="$(sha256sum "$HWPJS_TEST_WASM" | cut -d ' ' -f 1)"
          node --experimental-transform-types --max-old-space-size=512 --test --test-concurrency=1 apps/demo/tests/api-playground-bullet-definition.test.mjs packages/cli/tests/paragraph-bullet-definition-bridges.test.mjs

      - name: Test HWP5 bullet resources and independent CFB preservation
        timeout-minutes: 3
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_OLD_WASM: ${{ runner.temp }}/hwpjs-before-h5-bullet.wasm
          HWPJS_TEST_EVIDENCE: ${{ runner.temp }}/hwpjs-h5-bullet-evidence
        run: |
          previous_engine=cce7ead1fc1ca17b73bebd01ea3d72945272e1da
          if ! git cat-file -e "$previous_engine^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$previous_engine"
          fi
          git show "$previous_engine:apps/docs/docs/public/editor/hwpjs/hwpjs.wasm" > "$HWPJS_TEST_OLD_WASM"
          printf '%s  %s\n' 'afd903edc5658543b768491efb6ee6fbdbe185a8f393334a363acbd2eb5510ae' "$HWPJS_TEST_OLD_WASM" | sha256sum --check
          bun test --timeout=30000 --no-install tests/wasm/hwp5-bullet-write.test.mjs packages/core/tests/editor/hwp5-bullet-definition-write.test.ts

      - name: Test named field creation, value changes and renaming
        timeout-minutes: 2
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
        run: |
          bun build packages/core/src/worker.ts --target browser --format esm --outfile packages/core/src/worker.js
          bun test --no-install ./packages/core/tests/editor/named-fields-runtime.test.ts ./packages/core/tests/editor/identity.test.ts ./packages/core/tests/editor/selection-version.test.ts ./packages/core/tests/editor/named-field-bullet-history.test.ts ./packages/core/tests/runtime/native-module-profiles.test.ts
      - name: Test new document and table appearance contracts
        timeout-minutes: 2
        run: |
          bun test --no-install \
            ./packages/core/tests/editor/new-document.test.ts \
            ./packages/core/tests/editor/new-document-selection.test.ts \
            ./apps/demo/tests/new-document.test.ts \
            ./apps/demo/tests/new-document-shortcut.test.ts
          node --max-old-space-size=256 --test --test-concurrency=1 \
            ./tests/cell-border-batch.test.mjs \
            ./tests/cell-appearance-command.test.mjs \
            ./tests/cell-fill-command.test.mjs \
            ./tests/cell-diagonal-command.test.mjs \
            ./tests/hwp5/table-diagonal-paint-plan.test.mjs \
            ./tests/hwpx/table-diagonal-paint.test.mjs \
            ./tests/hwpx/table-border-paint.test.mjs \
            ./tests/hwpx/table-semantic-face-fill.test.mjs \
            ./tests/hwpx/table-semantic-fill-source.test.mjs \
            ./tools/tests/hwpx-table-border-raw-fields.test.mjs \
            ./tests/hwp5/table-border-fill-plan.test.mjs \
            ./tests/hwp5/table-variant-fill-plan.test.mjs \
            ./tools/tests/table-cell-appearance-observation.test.mjs \
            ./tools/tests/table-cell-appearance-official-hatch.test.mjs \
            ./tests/table-border-plan.test.mjs
      - name: Test integrated table appearance dialog
        timeout-minutes: 2
        run: |
          node --experimental-transform-types --max-old-space-size=256 \
            --import ./tools/object-properties-test-css.mjs \
            --import ./apps/demo/tests/table-cell-appearance-style-preload.mjs \
            --test --test-isolation=none --test-concurrency=1 \
            ./apps/demo/tests/table-cell-appearance-port.test.mjs \
            ./apps/demo/tests/table-cell-appearance-view.test.mjs \
            ./apps/demo/tests/table-cell-preview-eligibility.test.mjs \
            ./apps/demo/tests/table-cell-appearance-tool.test.mjs
      - name: Test symbol catalog and six-alignment quick actions
        timeout-minutes: 2
        run: |
          set -- \
            ./apps/demo/tests/symbol-buffer.test.ts \
            ./apps/demo/tests/symbol-category-data.test.ts \
            ./apps/demo/tests/symbol-dialog.test.ts \
            ./apps/demo/tests/symbol-insertion-boundary.test.ts \
            ./apps/demo/tests/quick-alignment-six.test.mjs
          for path in "$@"; do test -f "$path" || exit 1; done
          bun test --no-install "$@"
      - name: Share official Native WASM input pin
        run: |
          test -f ./packages/core/dist/build-manifest.json || exit 1
          HWPJS_TEST_WASM_EXPECTED_SHA256="$(node ./tools/tests/helpers/native-wasm-pin.mjs --manifest ./packages/core/dist/build-manifest.json)" || exit 1
          printf 'HWPJS_TEST_WASM_EXPECTED_SHA256=%s\n' "$HWPJS_TEST_WASM_EXPECTED_SHA256" >> "$GITHUB_ENV"
      - name: Test page settings SDK and independent saved-file oracles
        timeout-minutes: 3
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_PAGE_REGRESSION_OUT: ${{ runner.temp }}/hwpjs-page-settings-sdk
        run: |
          export HWPJS_TEST_WASM_SHA256="$HWPJS_TEST_WASM_EXPECTED_SHA256"
          node --max-old-space-size=512 tools/run-page-settings-regressions.mjs sdk
      - name: Preserve page settings SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-settings-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hwpjs-page-settings-sdk
          retention-days: 7
          if-no-files-found: warn
      - name: Test generated paragraph extended formatting Core admission
        timeout-minutes: 2
        run: |
          test -f ./packages/core/tests/commands/generated-extended-formatting.test.ts || exit 1
          test -f ./packages/core/tests/state/formatting-state.test.ts || exit 1
          bun test --no-install \
            ./packages/core/tests/commands/generated-extended-formatting.test.ts \
            ./packages/core/tests/state/formatting-state.test.ts
      - name: Test generated paragraph extended formatting actual Native binding
        timeout-minutes: 2
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_ORACLE_ROOT: ${{ github.workspace }}
        run: |
          test -f ./tools/tests/hwp5-generated-extended-formatting.test.mjs || exit 1
          test -n "$HWPJS_TEST_WASM_EXPECTED_SHA256" || exit 1
          export HWPJS_TEST_WASM_SHA256="$HWPJS_TEST_WASM_EXPECTED_SHA256"
          node --max-old-space-size=512 --test --test-concurrency=1 --test-timeout=45000 \
            ./tools/tests/hwp5-generated-extended-formatting.test.mjs
      - name: Test generated paragraph atomic formatting admission
        timeout-minutes: 2
        run: |
          test -f ./packages/core/tests/commands/generated-atomic-formatting.test.ts || exit 1
          test -f ./packages/core/tests/commands/generated-atomic-runtime.test.mjs || exit 1
          bun test --no-install \
            ./packages/core/tests/commands/generated-atomic-formatting.test.ts \
            ./packages/core/tests/commands/generated-atomic-runtime.test.mjs
      - name: Test generated paragraph atomic formatting actual Native save and history
        timeout-minutes: 2
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_ORACLE_ROOT: ${{ github.workspace }}
        run: |
          test -f ./tools/tests/hwp5-generated-atomic-formatting.test.mjs || exit 1
          test -n "$HWPJS_TEST_WASM_EXPECTED_SHA256" || exit 1
          export HWPJS_TEST_WASM_SHA256="$HWPJS_TEST_WASM_EXPECTED_SHA256"
          node --max-old-space-size=512 --test --test-concurrency=1 --test-timeout=45000 \
            ./tools/tests/hwp5-generated-atomic-formatting.test.mjs
      - name: Test generated HWPX atomic formatting actual Native save and history
        timeout-minutes: 2
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
        run: |
          test -f ./tools/tests/hwpx-generated-atomic-formatting.test.mjs || exit 1
          test -n "$HWPJS_TEST_WASM_EXPECTED_SHA256" || exit 1
          export HWPJS_TEST_WASM_SHA256="$HWPJS_TEST_WASM_EXPECTED_SHA256"
          node --max-old-space-size=512 --test --test-concurrency=1 --test-timeout=45000 \
            ./tools/tests/hwpx-generated-atomic-formatting.test.mjs
      - name: Test original table style and fill Native transactions
        timeout-minutes: 2
        env:
          HWPJS_TEST_WASM: ${{ github.workspace }}/apps/docs/docs/public/editor/hwpjs/hwpjs.wasm
          HWPJS_TEST_NOORI: ${{ github.workspace }}/apps/docs/docs/public/editor/fixtures/noori.hwp
          HWPJS_TEST_NOORI_HWPX: ${{ github.workspace }}/apps/docs/docs/public/editor/fixtures/noori.hwpx
        run: |
          export HWPJS_TEST_WASM_SHA256="$HWPJS_TEST_WASM_EXPECTED_SHA256"
          node --max-old-space-size=512 --test --test-concurrency=1 \
            --test-timeout=45000 ./tests/cell-style-fill-native.test.mjs \
            ./tests/cell-diagonal-native.test.mjs \
            ./tools/tests/cell-diagonal-runtime.test.mjs \
            ./tools/tests/hwpx-border-source-raw-native.test.mjs
      - name: Test public package JSX runtime compatibility
        run: bun test ./tests/public-package-jsx-runtime.test.mjs
      - name: Test owned observation freeze boundaries
        run: |
          test -f ./packages/core/tests/state/owned.test.ts || exit 1
          test -f ./packages/core/tests/state/owned-freeze-observation.test.ts || exit 1
          bun test --no-install ./packages/core/tests/state/owned.test.ts ./packages/core/tests/state/owned-freeze-observation.test.ts
      - name: Check demo shell icon and command types
        run: |
          test -f ./tools/tsconfig.demo-shell.json || exit 1
          bunx --no-install tsc --noEmit -p ./tools/tsconfig.demo-shell.json
      - name: Test table insertion target availability and resource defaults
        run: |
          test -f ./packages/core/tests/commands/table-insert-availability.test.ts || exit 1
          test -f ./apps/demo/tests/table-insert-target-availability.test.ts || exit 1
          bun test --no-install ./packages/core/tests/commands/table-insert.test.ts ./packages/core/tests/commands/table-insert-availability.test.ts ./apps/demo/tests/table-insert.test.ts ./apps/demo/tests/table-insert-uncertain.test.ts ./apps/demo/tests/table-insert-target-availability.test.ts
