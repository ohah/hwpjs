name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
      - 'tools/build-pages-demo.mjs'
      - 'tools/pages-demo/**'
      - 'tests/pages-demo-javascript-syntax.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Check generated JavaScript syntax under Bun
        run: bun test ./tests/pages-demo-javascript-syntax.test.mjs
      - name: Verify bundled editor artifacts
        run: bun tools/build-pages-demo.mjs --verify
      - name: Prepare independent documentation workspace
        run: |
          mkdir -p "$RUNNER_TEMP/hwpjs-docs"
          cp -R apps/docs/package.json apps/docs/bun.lock apps/docs/rspress.config.ts apps/docs/docs apps/docs/scripts apps/docs/components apps/docs/theme "$RUNNER_TEMP/hwpjs-docs/"
      - name: Install documentation dependencies
        working-directory: ${{ runner.temp }}/hwpjs-docs
        run: bun install --frozen-lockfile
      - name: Build and check public documentation
        working-directory: ${{ runner.temp }}/hwpjs-docs
        env:
          HWPJS_DOCS_BASE: /hwpjs/
        run: |
          bun run build
          bun run check:links
          bun run check:licenses
          bun run check:public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/hwpjs-docs/doc_build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
