name: MCP 전용 패키지 검증

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/hwpjs-mcp/**'
      - '.github/workflows/mcp-package.yml'
      - 'bun.lock'
  pull_request:
    paths:
      - 'packages/hwpjs-mcp/**'
      - '.github/workflows/mcp-package.yml'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  installed-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd packages/hwpjs-mcp build
      - name: tarball 설치와 실제 문서 읽기
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/hwpjs-mcp-package"
          consumer_dir="$RUNNER_TEMP/hwpjs-mcp-consumer"
          mkdir -p "$package_dir" "$consumer_dir"
          (cd packages/hwpjs-mcp && npm pack --pack-destination "$package_dir")
          printf '{"private":true,"type":"module"}\n' > "$consumer_dir/package.json"
          (cd "$consumer_dir" && npm install "$package_dir/ohah-hwpjs-mcp-0.1.0.tgz")
          HWPJS_MCP_CONSUMER="$consumer_dir" \
            HWPJS_MCP_FIXTURES="$GITHUB_WORKSPACE/apps/docs/docs/public/editor/fixtures" \
            node --test packages/hwpjs-mcp/tests/installed.test.mjs
